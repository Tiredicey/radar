name: Autonomous Student Capital Inflow Radar

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funding-radar-monitor
  cancel-in-progress: false

jobs:
  poll-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore alert history
        uses: actions/cache/restore@v4
        with:
          path: vouchers.db
          key: radar-history-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-history-v2-

      - name: Publish feeds to Radar dashboard
        env:
          RADAR_URL: https://radar-1y6.pages.dev
          RADAR_SYNC_TOKEN: ${{ secrets.RADAR_SYNC_TOKEN }}
        run: python publish_dashboard.py

      - name: Run Capital Radar and Dispatch to Messenger
        env:
          CALLMEBOT_KEY: ${{ secrets.CALLMEBOT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CALLMEBOT_KEY" ]; then
            echo '::error::CALLMEBOT_KEY is missing.'
            exit 1
          fi
          if [ ! -f vouchers.db ]; then
            export RADAR_BASELINE=1
            echo '::warning::No alert history restored. Establishing a silent baseline.'
          fi
          python promo_engine.py --auto

      - name: Save alert history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vouchers.db
          key: radar-history-v2-${{ github.run_id }}-${{ github.run_attempt }}
